[package]
name = "color-grade"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
futures = "0.3.34"
gpui-kit = "0.8.0"
image = "0.25.10"
lru = "0.19.0"
rayon = "1.12.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.dev]
opt-level = 0

# To avoid the app being unberablly slow
[profile.dev.package."*"]
opt-level = 3
