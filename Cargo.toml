[package]
name = "color-grade"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
futures = "0.3.34"
gpui-kit = { version = "0.9.1", features = ["assets", "gpui-fast"] }
image = "0.25.10"
lcms2 = { version = "6.3.0", features = ["static"] }
lru = "0.19.0"
mimalloc = "0.1.52"
ocio-rs = { version = "0.4", features = ["bundled", "v2_6"] }
rayon = "1.12.0"
strum = { version = "0.28.0", features = ["derive"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
lto = "fat"

[profile.dev]
opt-level = 0

# To avoid the app being unberablly slow
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
# To make ./build.rs execute after ocio-sys build complete
ocio-sys = { version = "0.4", features = ["bundled", "v2_6"] }
